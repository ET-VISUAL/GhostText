<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Шифрование Текста</title>
</head>

<body>
    <div class="container">
        <h1 class="text-centeral">🔒GhostText</h1>
        <h2 class="description">Программа создана для шифровки и дешифровки текста.</h2>
        <div class="cipher-panel">
            <form>
                <label for="cipher-choice">Выберите шифр:</label>
                <select id="cipher-choice">
                    <option value="caesar">Шифр цезаря</option>
                    <option value="atbash">Шифр атбаша</option>
                </select>
                <div class="shift-option" id="shift-option">
                    <label for="shift-input">Выберите сдвиг (1-25)</label>
                    <input type="number" id="shift-input" value="3" min="1" max="25" step="1">
                </div>
            </form>
        </div>
        <div class="crypto-row">
            <input type="text" id="text-input" placeholder="Введите текст">
            <button id="encrypt-btn">Зашифровать🛡️</button>
            <button id="decrypted-btn">Расшифровать🔑</button>
        </div>
        <div class="result-option">
            <label for="result-input">Результат:</label>
            <textarea type="text" id="result-input" readonly placeholder="Результат шифрования..."></textarea>
            <button id="copy-text">Скопировать результат🔗</button>
        </div>
        <div class="copy-toast">Скопировано!</div>
        <footer>
            <a href="https://github.com/ET-VISUAL/GhostText">Оценить проект🌟</a>
        </footer>
    </div>
    <script type="module" src="scripts/app.js"></script>
</body>

</html>
